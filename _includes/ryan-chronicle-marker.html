<!-- Reusable story marker for chapters and standalone stories featuring Ryan.
     Keep Liquid include instructions out of HTML comments; Jekyll evaluates them. -->
<style>
.ryan-chronicle-marker{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 14px;padding:12px 15px;margin:16px 0 22px;border:1px solid #c7dcf6;border-left:4px solid #2479d5;border-radius:10px;background:#f3f8ff;color:#244666;font:inherit}
.ryan-chronicle-marker .ryan-chronicle-kicker{font-size:.73rem;font-weight:700;letter-spacing:.075em;text-transform:uppercase;color:#195ea7}
.ryan-chronicle-marker .ryan-chronicle-name{display:block;font-size:.95rem;font-weight:600;color:#1c314b;margin-top:3px}
.ryan-chronicle-marker a{color:#1769c2;font-size:.89rem;font-weight:700;text-decoration:underline;text-underline-offset:2px}
</style>
<div class="ryan-chronicle-marker" role="note">
  <div><span class="ryan-chronicle-kicker">&#10022; A Ryan Chronicle</span>
    {% if include.story %}<span class="ryan-chronicle-name">{{ include.story | escape }}</span>{% endif %}
  </div>
  <a href="{{ '/about/ryan-chronicles/' | relative_url }}">View The Ryan Chronicles &rarr;</a>
</div>
