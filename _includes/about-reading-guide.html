<!-- ABOUT ME — CHAPTER NAVIGATION & READING PROGRESS -->

<div id="about-reading-guide" class="about-reading-guide">
  <div class="about-reading-guide-heading">
    <strong>Chapter Guide</strong>
    <span>Choose where to continue reading</span>
  </div>
  <nav class="about-reading-guide-links" aria-label="Autobiography chapter navigation"></nav>
</div>

<div id="about-reading-progress"
     class="about-reading-progress"
     role="progressbar"
     aria-label="About Me page reading progress"
     aria-valuemin="0"
     aria-valuemax="100"
     aria-valuenow="0">
  <span class="about-reading-progress-percent" aria-hidden="true">0%</span>
  <div class="about-reading-progress-track" aria-hidden="true">
    <div class="about-reading-progress-fill"></div>
  </div>
</div>

<style>
/* Chapter shortcuts — visible only on the About Me page */
#about-reading-guide {
  position: sticky;
  top: 10px;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 18px;
  margin: 20px 0 28px;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.97);
  border: 1px solid #dbe5f3;
  border-radius: 17px;
  box-shadow: 0 5px 0 #dbe5f3, 0 12px 24px rgba(23, 69, 125, 0.09);
  backdrop-filter: blur(8px);
}
#about-reading-guide .about-reading-guide-heading {
  display: flex;
  flex-direction: column;
  gap: 1px;
  flex: 0 0 auto;
}
#about-reading-guide .about-reading-guide-heading strong {
  font-size: 0.95rem;
  color: #182436;
}
#about-reading-guide .about-reading-guide-heading span {
  font-size: 0.72rem;
  color: #64748b;
}
#about-reading-guide .about-reading-guide-links {
  display: flex;
  flex: 1;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 7px;
  min-width: 0;
}
#about-reading-guide .about-reading-guide-links a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 11px;
  border: 1px solid #d6e5fb;
  border-radius: 10px;
  background: #f5f9ff;
  color: #1769c2;
  font-size: 0.79rem;
  font-weight: 600;
  line-height: 1.3;
  text-decoration: none;
  white-space: nowrap;
  transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
}
#about-reading-guide .about-reading-guide-links a .chapter-number {
  color: #738caf;
  font-size: 0.7rem;
}
#about-reading-guide .about-reading-guide-links a:hover,
#about-reading-guide .about-reading-guide-links a.is-current {
  background: #e7f1ff;
  box-shadow: 0 3px 8px rgba(37, 100, 190, 0.10);
  transform: translateY(-1px);
}
#about-reading-guide .about-reading-guide-links a:focus-visible {
  outline: 3px solid #78a9f7;
  outline-offset: 2px;
}
details.story-chapter,
#my-journal {
  scroll-margin-top: 115px;
}

/* Vertical reading indicator — away from the Back-to-Top button */
#about-reading-progress {
  --read-percentage: 0%;
  position: fixed;
  right: 12px;
  top: 46%;
  transform: translateY(-50%);
  z-index: 45;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  pointer-events: none;
}
#about-reading-progress .about-reading-progress-percent {
  color: #42658f;
  font-size: 0.7rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
#about-reading-progress .about-reading-progress-track {
  position: relative;
  width: 6px;
  height: 158px;
  border-radius: 20px;
  background: #e3ebf7;
  box-shadow: inset 0 1px 3px rgba(24, 48, 82, 0.12);
  overflow: hidden;
}
#about-reading-progress .about-reading-progress-fill {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: var(--read-percentage);
  border-radius: inherit;
  background: linear-gradient(180deg, #78adff, #2f70df);
}

/* Compact, unobtrusive layout for phones and tablets */
@media (max-width: 850px) {
  #about-reading-guide {
    top: 5px;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    padding: 9px 11px;
  }
  #about-reading-guide .about-reading-guide-heading span { display: none; }
  #about-reading-guide .about-reading-guide-links {
    flex-wrap: nowrap;
    justify-content: flex-start;
    overflow-x: auto;
    padding: 2px 0 4px;
    scrollbar-width: thin;
  }
  #about-reading-progress {
    top: 0;
    bottom: auto;
    left: 0;
    right: 0;
    width: 100%;
    height: 4px;
    transform: none;
  }
  #about-reading-progress .about-reading-progress-percent { display: none; }
  #about-reading-progress .about-reading-progress-track {
    width: 100%;
    height: 4px;
    border-radius: 0;
  }
  #about-reading-progress .about-reading-progress-fill {
    top: 0;
    bottom: auto;
    height: 100%;
    width: var(--read-percentage);
    border-radius: 0;
  }
  details.story-chapter, #my-journal { scroll-margin-top: 135px; }
}
@media (prefers-reduced-motion: reduce) {
  #about-reading-guide .about-reading-guide-links a { transition: none; }
  #about-reading-guide .about-reading-guide-links a:hover { transform: none; }
}
</style>

<script>
(function () {
  "use strict";

  function initializeReadingGuide() {
    const guide = document.getElementById("about-reading-guide");
    const progress = document.getElementById("about-reading-progress");
    if (!guide || !progress) return;

    const chapters = Array.from(document.querySelectorAll("details.story-chapter"));
    const linksContainer = guide.querySelector(".about-reading-guide-links");
    if (!chapters.length || !linksContainer) {
      guide.hidden = true;
      progress.hidden = true;
      return;
    }

    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const links = [];

    chapters.forEach(function (chapter, index) {
      const summary = chapter.querySelector("summary");
      if (!summary) return;

      if (!chapter.id) chapter.id = "story-chapter-" + (index + 1);
      const fullName = summary.textContent.trim().replace(/\s+/g, " ");
      const shortName = fullName.replace(/^Chapter\s+\d+\s*:\s*/i, "");

      const link = document.createElement("a");
      link.href = "#" + chapter.id;
      link.setAttribute("aria-label", "Jump to " + fullName);

      const number = document.createElement("span");
      number.className = "chapter-number";
      number.textContent = String(index + 1).padStart(2, "0");
      link.append(number, document.createTextNode(shortName));

      link.addEventListener("click", function (event) {
        event.preventDefault();
        chapter.open = true;
        history.replaceState(null, "", "#" + chapter.id);
        requestAnimationFrame(function () {
          chapter.scrollIntoView({
            behavior: reducedMotion ? "auto" : "smooth",
            block: "start"
          });
          summary.focus({ preventScroll: true });
        });
      });
      linksContainer.appendChild(link);
      links.push({ element: link, section: chapter });
    });

    const journalHeading = Array.from(document.querySelectorAll("h1, h2"))
      .find(function (heading) { return heading.textContent.trim() === "My Journal"; });
    if (journalHeading) {
      if (!journalHeading.id) journalHeading.id = "my-journal";
      const journalLink = document.createElement("a");
      journalLink.href = "#" + journalHeading.id;
      journalLink.textContent = "Journal";
      linksContainer.appendChild(journalLink);
      links.push({ element: journalLink, section: journalHeading });
    }

    // Respect a shared link to an individual chapter.
    const sharedSection = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (sharedSection && chapters.includes(sharedSection)) sharedSection.open = true;

    function updateReadingProgress() {
      const scrollable = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
      const percentage = scrollable ? Math.round(100 * window.scrollY / scrollable) : 100;
      const clamped = Math.max(0, Math.min(100, percentage));
      progress.style.setProperty("--read-percentage", clamped + "%");
      progress.setAttribute("aria-valuenow", String(clamped));
      progress.querySelector(".about-reading-progress-percent").textContent = clamped + "%";

      let current = null;
      links.forEach(function (item) {
        if (item.section.getBoundingClientRect().top <= 165) current = item;
      });
      links.forEach(function (item) {
        const isCurrent = item === current;
        item.element.classList.toggle("is-current", isCurrent);
        if (isCurrent) item.element.setAttribute("aria-current", "location");
        else item.element.removeAttribute("aria-current");
      });
    }

    window.addEventListener("scroll", updateReadingProgress, { passive: true });
    window.addEventListener("resize", updateReadingProgress);
    chapters.forEach(function (chapter) {
      chapter.addEventListener("toggle", function () {
        requestAnimationFrame(updateReadingProgress);
      });
    });
    updateReadingProgress();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initializeReadingGuide);
  } else {
    initializeReadingGuide();
  }
})();
</script>
