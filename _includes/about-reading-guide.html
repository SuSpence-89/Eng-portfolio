<!-- ABOUT ME — VERTICAL CHAPTER GUIDE & READING PROGRESS -->

<div id="about-reading-guide" class="about-reading-guide is-compact" aria-label="Chapter guide">
  <button type="button" class="about-reading-guide-toggle"
          aria-expanded="false" aria-controls="about-reading-guide-links"
          title="Open chapter guide">
    <span class="guide-menu-icon" aria-hidden="true">☰</span>
    <span>Chapters</span>
    <span class="guide-menu-chevron" aria-hidden="true">⌄</span>
  </button>
  <div class="about-reading-guide-heading">
    <strong>Chapter Guide</strong>
    <span>Choose where to continue reading</span>
  </div>
  <nav id="about-reading-guide-links" class="about-reading-guide-links"
       aria-label="Autobiography chapter navigation"></nav>
</div>

<div id="about-reading-progress"
     class="about-reading-progress"
     role="progressbar"
     aria-label="About Me page reading progress"
     aria-valuemin="0"
     aria-valuemax="100"
     aria-valuenow="0">
  <span class="about-reading-progress-percent" aria-hidden="true">0%</span>
  <div class="about-reading-progress-track" aria-hidden="true">
    <div class="about-reading-progress-fill"></div>
  </div>
</div>

<style>
/* Sidebar floats in the available margin without pushing the story. */
#about-reading-guide {
  position: fixed;
  z-index: 60;
  top: 110px;
  right: 18px;
  box-sizing: border-box;
  font-family: inherit;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid #dbe5f3;
  border-radius: 16px;
  box-shadow: 0 5px 0 #dbe5f3, 0 12px 24px rgba(23, 69, 125, 0.10);
  backdrop-filter: blur(8px);
}
#about-reading-guide[hidden] { display: none !important; }
#about-reading-guide .about-reading-guide-heading {
  display: flex;
  flex-direction: column;
  gap: 3px;
  margin-bottom: 12px;
  text-align: left;
}
#about-reading-guide .about-reading-guide-heading strong {
  font-size: 0.95rem;
  color: #182436;
}
#about-reading-guide .about-reading-guide-heading span {
  font-size: 0.73rem;
  color: #64748b;
}
#about-reading-guide .about-reading-guide-links {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 7px;
}
#about-reading-guide .about-reading-guide-links a {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  box-sizing: border-box;
  width: 100%;
  padding: 9px 10px;
  border: 1px solid #d6e5fb;
  border-radius: 10px;
  background: #f5f9ff;
  color: #1769c2;
  font-size: 0.81rem;
  font-weight: 600;
  line-height: 1.35;
  text-decoration: none;
  text-align: left;
  white-space: normal;
  transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
}
#about-reading-guide .about-reading-guide-links a .chapter-number {
  flex: 0 0 auto;
  color: #738caf;
  font-size: 0.72rem;
}
#about-reading-guide .about-reading-guide-links a:hover,
#about-reading-guide .about-reading-guide-links a.is-current {
  background: #e7f1ff;
  box-shadow: 0 3px 8px rgba(37, 100, 190, 0.10);
  transform: translateX(2px);
}
#about-reading-guide a:focus-visible,
#about-reading-guide button:focus-visible {
  outline: 3px solid #78a9f7;
  outline-offset: 2px;
}

/* Desktop sidebar grows to fit every chapter: no internal scroll box. */
#about-reading-guide.is-docked {
  right: auto;
  width: var(--guide-width, 265px);
  height: auto !important;
  max-height: none !important;
  overflow: visible !important;
  padding: 15px;
}
#about-reading-guide.is-docked .about-reading-guide-toggle { display: none; }
#about-reading-guide.is-docked .about-reading-guide-links {
  height: auto;
  max-height: none;
  overflow: visible;
}

/* If the browser window is short, tighten spacing before using compact mode. */
#about-reading-guide.is-docked.is-condensed { padding: 10px; }
#about-reading-guide.is-docked.is-condensed .about-reading-guide-heading {
  margin-bottom: 7px;
}
#about-reading-guide.is-docked.is-condensed .about-reading-guide-links { gap: 4px; }
#about-reading-guide.is-docked.is-condensed .about-reading-guide-links a {
  padding: 6px 8px;
  font-size: 0.76rem;
  line-height: 1.25;
}

/* Smaller screens: a compact Chapters button opens the vertical list on demand. */
#about-reading-guide.is-compact {
  width: auto;
  max-width: calc(100vw - 28px);
  padding: 0;
}
#about-reading-guide .about-reading-guide-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 10px 13px;
  border: 0;
  border-radius: 15px;
  color: #1769c2;
  background: #f5f9ff;
  font-family: inherit;
  font-size: 0.83rem;
  font-weight: 700;
  cursor: pointer;
}
#about-reading-guide .guide-menu-icon { font-size: 1rem; }
#about-reading-guide .guide-menu-chevron { font-size: 1.2rem; line-height: 1; }
#about-reading-guide.is-compact:not(.is-open) .about-reading-guide-heading,
#about-reading-guide.is-compact:not(.is-open) .about-reading-guide-links { display: none; }
#about-reading-guide.is-compact.is-open {
  width: min(256px, calc(100vw - 28px));
  padding: 0 10px 12px;
  max-height: min(75vh, 510px);
  overflow-y: auto;
}
#about-reading-guide.is-compact.is-open .about-reading-guide-toggle {
  margin-bottom: 10px;
  justify-content: flex-start;
  border-bottom: 1px solid #e6eef8;
}
#about-reading-guide.is-compact.is-open .guide-menu-chevron {
  transform: rotate(180deg);
}
#about-reading-guide.is-compact.is-open .about-reading-guide-heading {
  padding: 0 4px;
}

/* Scroll offsets account for the fixed site header rather than the old sticky guide. */
details.story-chapter, #my-journal { scroll-margin-top: 85px; }

/* Reading percentage: keep the same side meter away from the Back-to-Top button. */
#about-reading-progress {
  --read-percentage: 0%;
  position: fixed;
  right: 12px;
  top: 46%;
  transform: translateY(-50%);
  z-index: 45;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  pointer-events: none;
}
#about-reading-progress[hidden] { display: none !important; }
#about-reading-progress .about-reading-progress-percent {
  color: #42658f;
  font-size: 0.7rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
#about-reading-progress .about-reading-progress-track {
  position: relative;
  width: 6px;
  height: 158px;
  border-radius: 20px;
  background: #e3ebf7;
  box-shadow: inset 0 1px 3px rgba(24, 48, 82, 0.12);
  overflow: hidden;
}
#about-reading-progress .about-reading-progress-fill {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: var(--read-percentage);
  border-radius: inherit;
  background: linear-gradient(180deg, #78adff, #2f70df);
}

@media (max-width: 850px) {
  #about-reading-guide { top: 79px; right: 12px; }
  #about-reading-progress {
    top: 0;
    bottom: auto;
    left: 0;
    right: 0;
    width: 100%;
    height: 4px;
    transform: none;
  }
  #about-reading-progress .about-reading-progress-percent { display: none; }
  #about-reading-progress .about-reading-progress-track {
    width: 100%;
    height: 4px;
    border-radius: 0;
  }
  #about-reading-progress .about-reading-progress-fill {
    top: 0;
    bottom: auto;
    height: 100%;
    width: var(--read-percentage);
    border-radius: 0;
  }
  details.story-chapter, #my-journal { scroll-margin-top: 80px; }
}
@media (prefers-reduced-motion: reduce) {
  #about-reading-guide .about-reading-guide-links a { transition: none; }
  #about-reading-guide .about-reading-guide-links a:hover { transform: none; }
}
</style>

<script>
(function () {
  "use strict";

  function initializeReadingGuide() {
    const guide = document.getElementById("about-reading-guide");
    const progress = document.getElementById("about-reading-progress");
    if (!guide || !progress) return;

    const chapters = Array.from(document.querySelectorAll("details.story-chapter"));
    const linksContainer = guide.querySelector(".about-reading-guide-links");
    const toggle = guide.querySelector(".about-reading-guide-toggle");
    if (!chapters.length || !linksContainer || !toggle) {
      guide.hidden = true;
      progress.hidden = true;
      return;
    }

    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const links = [];

    function setOpen(open) {
      guide.classList.toggle("is-open", open);
      toggle.setAttribute("aria-expanded", String(open));
      toggle.title = open ? "Close chapter guide" : "Open chapter guide";
    }

    // Only keep the full sidebar visible when it fits OUTSIDE the story column.
    // On narrow screens the small Chapters button remains available instead.
    function switchToCompact() {
      const wasDocked = guide.classList.contains("is-docked");
      guide.classList.remove("is-docked", "is-condensed");
      guide.classList.add("is-compact");
      guide.style.left = "";
      guide.style.right = "";
      if (wasDocked) setOpen(false);
    }

    function positionGuide() {
      const bounds = chapters[0].getBoundingClientRect();
      const rightSpace = window.innerWidth - bounds.right;
      const leftSpace = bounds.left;
      const sidebarWidth = 265;
      const gap = 20;
      const margin = 38;
      const topOffset = 110;
      const bottomMargin = 20;
      let left = null;

      if (window.innerWidth > 1000 && rightSpace >= sidebarWidth + gap + margin) {
        left = bounds.right + gap;
      } else if (window.innerWidth > 1000 && leftSpace >= sidebarWidth + gap + margin) {
        left = bounds.left - sidebarWidth - gap;
      }

      if (left === null) {
        switchToCompact();
        return;
      }

      guide.classList.remove("is-compact", "is-condensed");
      guide.classList.add("is-docked");
      guide.style.left = Math.round(left) + "px";
      guide.style.right = "auto";
      guide.style.setProperty("--guide-width", sidebarWidth + "px");
      setOpen(false);

      // Let the sidebar expand for additional chapters, without a scrollbar.
      // On shorter windows, reduce spacing first; if necessary use compact mode.
      const availableHeight = window.innerHeight - topOffset - bottomMargin;
      if (guide.scrollHeight > availableHeight) {
        guide.classList.add("is-condensed");
      }
      if (guide.scrollHeight > availableHeight) {
        switchToCompact();
      }
    }

    toggle.addEventListener("click", function () {
      setOpen(!guide.classList.contains("is-open"));
    });

    document.addEventListener("click", function (event) {
      if (guide.classList.contains("is-compact") &&
          guide.classList.contains("is-open") && !guide.contains(event.target)) {
        setOpen(false);
      }
    });

    chapters.forEach(function (chapter, index) {
      const summary = chapter.querySelector("summary");
      if (!summary) return;

      if (!chapter.id) chapter.id = "story-chapter-" + (index + 1);
      const fullName = summary.textContent.trim().replace(/\s+/g, " ");
      const shortName = fullName.replace(/^Chapter\s+\d+\s*:\s*/i, "");
      const link = document.createElement("a");
      link.href = "#" + chapter.id;
      link.setAttribute("aria-label", "Jump to " + fullName);
      const number = document.createElement("span");
      number.className = "chapter-number";
      number.textContent = String(index + 1).padStart(2, "0");
      link.append(number, document.createTextNode(shortName));

      link.addEventListener("click", function (event) {
        event.preventDefault();
        chapter.open = true;
        history.replaceState(null, "", "#" + chapter.id);
        if (guide.classList.contains("is-compact")) setOpen(false);
        requestAnimationFrame(function () {
          chapter.scrollIntoView({
            behavior: reducedMotion ? "auto" : "smooth",
            block: "start"
          });
          summary.focus({ preventScroll: true });
        });
      });
      linksContainer.appendChild(link);
      links.push({ element: link, section: chapter });
    });

    const journalHeading = Array.from(document.querySelectorAll("h1, h2"))
      .find(function (heading) { return heading.textContent.trim() === "My Journal"; });
    if (journalHeading) {
      if (!journalHeading.id) journalHeading.id = "my-journal";
      const journalLink = document.createElement("a");
      journalLink.href = "#" + journalHeading.id;
      journalLink.textContent = "Journal";
      journalLink.addEventListener("click", function () {
        if (guide.classList.contains("is-compact")) setOpen(false);
      });
      linksContainer.appendChild(journalLink);
      links.push({ element: journalLink, section: journalHeading });
    }

    const sharedSection = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (sharedSection && chapters.includes(sharedSection)) sharedSection.open = true;

    function updateReadingProgress() {
      const scrollable = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
      const percentage = scrollable ? Math.round(100 * window.scrollY / scrollable) : 100;
      const clamped = Math.max(0, Math.min(100, percentage));
      progress.style.setProperty("--read-percentage", clamped + "%");
      progress.setAttribute("aria-valuenow", String(clamped));
      progress.querySelector(".about-reading-progress-percent").textContent = clamped + "%";

      let current = null;
      links.forEach(function (item) {
        if (item.section.getBoundingClientRect().top <= 165) current = item;
      });
      links.forEach(function (item) {
        const isCurrent = item === current;
        item.element.classList.toggle("is-current", isCurrent);
        if (isCurrent) item.element.setAttribute("aria-current", "location");
        else item.element.removeAttribute("aria-current");
      });
    }

    window.addEventListener("scroll", updateReadingProgress, { passive: true });
    window.addEventListener("resize", function () {
      positionGuide();
      updateReadingProgress();
    });
    chapters.forEach(function (chapter) {
      chapter.addEventListener("toggle", function () {
        requestAnimationFrame(updateReadingProgress);
      });
    });
    positionGuide();
    updateReadingProgress();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initializeReadingGuide);
  } else {
    initializeReadingGuide();
  }
})();
</script>
