<style>

/* =====================================================

  text-decoration: none;
  will-change: transform, opacity;
}

  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
}

  border-color: #4a76ee;
  box-shadow: 0 6px 18px rgba(74,118,238,0.28);
}

  outline: 3px solid #4a76ee;
  outline-offset: 3px;
}

  position: absolute;

  bottom: 2px;

  width: 210px;

  transform: translateX(-50%);

  filter: blur(15px);

  pointer-events: none;

  font-size: 13px;
  color: #777;

<script>
(function () {
  "use strict";

  function initializeProjectGlobe() {

    const globe = document.getElementById("engineering-globe");

    if (!globe) return;

    const images = Array.from(
      globe.querySelectorAll(".globe-image")
    );

    if (!images.length) return;

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    let rotationY = 0;
    let rotationX = 0.16;

    let dragging = false;
    let activePointer = null;

    let lastX = 0;
    let lastY = 0;

    let movedDuringDrag = false;
    let suppressNextClick = false;

    let paused = false;
    let previousTime = null;

    const count = images.length;

    /*
     * Fibonacci sphere distribution:
     * Places photographs around an invisible sphere,
     * leaving open space between individual images.
     */

    const points = images.map(function (_, index) {

      const y = 1 - (index / (count - 1)) * 2;

      const horizontalRadius = Math.sqrt(
        Math.max(0, 1 - y * y)
      );

      const theta = Math.PI * (3 - Math.sqrt(5)) * index;

      return {
        x: Math.cos(theta) * horizontalRadius,
        y: y,
        z: Math.sin(theta) * horizontalRadius
      };

    });

    function renderGlobe() {

      const mobile = globe.clientWidth < 380;

      const radius = mobile ? 115 : 166;

      const cosineY = Math.cos(rotationY);
      const sineY = Math.sin(rotationY);

      const cosineX = Math.cos(rotationX);
      const sineX = Math.sin(rotationX);

      images.forEach(function (image, index) {

        const point = points[index];

        // Rotate around vertical axis.

        const x1 =
          point.x * cosineY +
          point.z * sineY;

        const z1 =
          -point.x * sineY +
          point.z * cosineY;

        // Rotate around horizontal axis.

        const y2 =
          point.y * cosineX -
          z1 * sineX;

        const z2 =
          point.y * sineX +
          z1 * cosineX;

        // Simulate depth and perspective.

        const depth = (z2 + 1) / 2;

        const scale = 0.65 + depth * 0.50;

        const x = x1 * radius;
        const y = y2 * radius;

        image.style.transform =
          "translate(-50%, -50%) " +
          "translate3d(" + x + "px," + y + "px,0) " +
          "scale(" + scale + ")";

        image.style.opacity = String(
          0.18 + depth * 0.82
        );

        image.style.zIndex = String(
          Math.round(depth * 100)
        );

        // Rear photographs are visible but not clickable.

        const onFront = z2 > -0.05;

        image.style.pointerEvents =
          onFront ? "auto" : "none";

        image.tabIndex = onFront ? 0 : -1;

      });
    }

    function animate(time) {

      if (previousTime === null) {
        previousTime = time;
      }

      const delta = Math.min(time - previousTime, 60);

      previousTime = time;

      if (!paused && !dragging && !reducedMotion) {

        // Approximately one rotation every 50 seconds.

        rotationY +=
          (delta / 50000) * Math.PI * 2;

        renderGlobe();

      }

      requestAnimationFrame(animate);
    }

    globe.addEventListener("pointerdown", function (event) {

      if (reducedMotion) return;

      if (event.button !== 0) return;

      dragging = true;
      activePointer = event.pointerId;

      lastX = event.clientX;
      lastY = event.clientY;

      movedDuringDrag = false;

    });

    window.addEventListener("pointermove", function (event) {

      if (!dragging || event.pointerId !== activePointer) {
        return;
      }

      const dx = event.clientX - lastX;
      const dy = event.clientY - lastY;

      if (Math.abs(dx) + Math.abs(dy) > 2) {
        movedDuringDrag = true;
      }

      rotationY += dx * 0.008;
      rotationX += dy * 0.005;

      rotationX = Math.max(
        -0.9,
        Math.min(0.9, rotationX)
      );

      lastX = event.clientX;
      lastY = event.clientY;

      renderGlobe();

    });

    function endDrag(event) {

      if (!dragging || event.pointerId !== activePointer) {
        return;
      }

      dragging = false;
      activePointer = null;

      if (movedDuringDrag) {
        suppressNextClick = true;
      }
    }

    window.addEventListener("pointerup", endDrag);

    window.addEventListener("pointercancel", endDrag);

    globe.addEventListener("click", function (event) {

      if (suppressNextClick) {
        event.preventDefault();
        suppressNextClick = false;
      }

    }, true);

    globe.addEventListener("mouseenter", function () {
      paused = true;
    });

    globe.addEventListener("mouseleave", function () {
      paused = false;
    });

    globe.addEventListener("focusin", function () {
      paused = true;
    });

    globe.addEventListener("focusout", function (event) {
      if (!globe.contains(event.relatedTarget)) {
        paused = false;
      }
    });

    window.addEventListener("resize", renderGlobe);

    // Avoid animating while the page is hidden.
    document.addEventListener("visibilitychange", function () {
      previousTime = null;
    });

    renderGlobe();

    if (!reducedMotion) {
      requestAnimationFrame(animate);
    }

  }

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      initializeProjectGlobe
    );
  } else {
    initializeProjectGlobe();
  }

})();
</script>
